<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Careloop · Official Pitch Decks & Presentations</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0F1411;
      color: #18231C;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Control Bar */
    .top-bar {
      height: 64px;
      background: #18231C;
      border-bottom: 1px solid #2B3830;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #FFF;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-badge {
      width: 32px;
      height: 32px;
      background: #2D6A4F;
      color: #FFF;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 700;
      color: #FFF;
    }
    .brand-subtitle {
      font-size: 11px;
      color: #A3B18A;
    }

    /* Deck Selector Tabs */
    .deck-switcher {
      display: flex;
      background: #232E27;
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
    }
    .deck-tab {
      background: transparent;
      border: none;
      color: #A3B18A;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .deck-tab.active {
      background: #2D6A4F;
      color: #FFF;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-action {
      background: #2B3830;
      color: #FFF;
      border: 1px solid #3E4F44;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }
    .btn-action:hover {
      background: #384A3F;
    }

    /* Slide Stage */
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }
    .slide-card {
      width: 100%;
      max-width: 1040px;
      aspect-ratio: 16 / 9;
      background: #FBFBFA;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      border: 1px solid #E8EAE7;
      display: flex;
      flex-direction: column;
      padding: 48px;
      position: relative;
      overflow: hidden;
      justify-content: space-between;
    }

    /* Slide Content Typography */
    .slide-header {
      margin-bottom: 24px;
    }
    .slide-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #2D6A4F;
      background: #EBF7EE;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .slide-title {
      font-size: 28px;
      font-weight: 800;
      color: #18231C;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 8px;
    }
    .slide-subtitle {
      font-size: 15px;
      color: #5C6E63;
      font-weight: 500;
    }

    .slide-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .slide-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #E8EAE7;
      padding-top: 16px;
      font-size: 12px;
      color: #8C9990;
    }

    /* Grids & Cards inside slides */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .card-box {
      background: #FFFFFF;
      border: 1px solid #E8EAE7;
      border-radius: 12px;
      padding: 18px;
    }
    .card-box.highlight {
      border-color: #2D6A4F;
      background: #F4F9F5;
      box-shadow: 0 4px 12px rgba(45,106,79,0.08);
    }
    .card-tag {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: #6C7570;
      margin-bottom: 6px;
    }
    .card-num {
      font-size: 24px;
      font-weight: 800;
      color: #18231C;
      margin-bottom: 4px;
    }
    .card-num.green { color: #2D6A4F; }
    .card-desc {
      font-size: 12px;
      color: #5C6E63;
      line-height: 1.4;
    }

    /* Bottom Navigation Bar */
    .bottom-bar {
      height: 60px;
      background: #18231C;
      border-top: 1px solid #2B3830;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #A3B18A;
      font-size: 12px;
    }
    .nav-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-nav {
      background: #232E27;
      border: 1px solid #3E4F44;
      color: #FFF;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .btn-nav:hover { background: #2D6A4F; }
    .btn-nav:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      background: #232E27;
    }

    .speaker-notes-drawer {
      background: #141B16;
      border-top: 1px solid #2B3830;
      padding: 12px 24px;
      font-size: 12px;
      color: #CBD5E1;
      display: none;
    }
    .speaker-notes-drawer.open {
      display: block;
    }

    /* Print Styles for Export to PDF */
    @media print {
      body {
        background: #FFF;
        overflow: visible;
        height: auto;
      }
      .top-bar, .bottom-bar, .speaker-notes-drawer {
        display: none !important;
      }
      .stage {
        padding: 0;
        display: block;
      }
      .slide-card {
        page-break-after: always;
        break-after: page;
        width: 100% !important;
        max-width: 100% !important;
        aspect-ratio: auto;
        height: 100vh;
        border: none;
        border-radius: 0;
        box-shadow: none;
        padding: 40px;
      }
    }
  </style>
</head>

    let activeDeckKey = 'doctors';

    function renderSlide() {

          <span class="slide-tag">${slide.tag}</span>
          <h2 class="slide-title">${slide.title}</h2>

          <span>Slide ${currentSlideIdx + 1} of ${deck.slides.length}</span>
        </div>
      `;

      document.getElementById('notesContent').textContent = slide.notes;
    }

    function switchDeck(key) {
      activeDeckKey = key;
      currentSlideIdx = 0;
      document.querySelectorAll('.deck-tab').forEach((tab, idx) => {
        const keys = ['doctors', 'investors', 'team'];
        tab.classList.toggle('active', keys[idx] === key);
      });
      renderSlide();
    }

    function nextSlide() {
      if (currentSlideIdx < decks[activeDeckKey].slides.length - 1) {
        currentSlideIdx++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlideIdx > 0) {
        currentSlideIdx--;
        renderSlide();
      }
    }

    function toggleNotes() {
      showNotes = !showNotes;
      document.getElementById('notesDrawer').classList.toggle('open', showNotes);
    }

    // Keyboard Navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        prevSlide();
      }
    });

    // Initial render
    renderSlide();
  </script>
</body>
</html>
